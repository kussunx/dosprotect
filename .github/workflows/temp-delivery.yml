name: Temporary Delivery Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }} hosted delivery
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - l4d
          - l4d2

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify mitigation guard
        shell: pwsh
        run: .\scripts\verify-legacy-mitigation.ps1

      - name: Build
        shell: pwsh
        run: .\scripts\build.ps1 -Target ${{ matrix.target }} -Configuration Release

      - name: Emit build metadata and DLL
        shell: pwsh
        run: |
          $target = '${{ matrix.target }}'
          if ($target -eq 'l4d') {
            $dll = 'artifacts\dosprotect-l4d-win32\addons\dosprotect\bin\dosprotect_l4d1_mm.dll'
            $info = 'artifacts\dosprotect-l4d-win32\build-info.txt'
          } else {
            $dll = 'artifacts\dosprotect-l4d2-win32\addons\dosprotect\bin\dosprotect_l4d2_mm.dll'
            $info = 'artifacts\dosprotect-l4d2-win32\build-info.txt'
          }

          Get-Content $info
          $base64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($dll))
          Write-Host "DOSP_BASE64_BEGIN_$target"
          for ($offset = 0; $offset -lt $base64.Length; $offset += 8000) {
            $length = [Math]::Min(8000, $base64.Length - $offset)
            Write-Host $base64.Substring($offset, $length)
          }
          Write-Host "DOSP_BASE64_END_$target"
