name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dosprotect-main
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }} / Windows x86
    runs-on: self-hosted
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        target: [l4d, l4d2]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify mitigation
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-mitigation.ps1

      - name: Build ${{ matrix.target }}
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Target ${{ matrix.target }} -Configuration Release

      - name: Build info
        shell: cmd
        run: type out\${{ matrix.target }}\build-info.txt
