name: Build DoS Protect

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dosprotect-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    name: ${{ matrix.target }} / Windows x86
    runs-on: self-hosted
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        target:
          - l4d
          - l4d2

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify legacy mitigation
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-legacy-mitigation.ps1

      - name: Build and package ${{ matrix.target }}
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Target ${{ matrix.target }} -Configuration Release

      - name: Report build metadata
        shell: cmd
        run: type artifacts\dosprotect-${{ matrix.target }}-win32\build-info.txt

      - name: Deliver to C:\L4D-DEV\dosprotect
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\deploy-local.ps1 -Target ${{ matrix.target }}

      - name: Upload package (best effort)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dosprotect-${{ matrix.target }}-win32
          path: artifacts/dosprotect-${{ matrix.target }}-win32/**
          if-no-files-found: error
          retention-days: 14

  cleanup-delivery-branches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    name: Remove temporary delivery branches
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Delete temporary delivery branches
        shell: cmd
        run: |
          git push origin --delete delivery/l4d || echo delivery/l4d already removed.
          git push origin --delete delivery/l4d2 || echo delivery/l4d2 already removed.

  cleanup-merged-branch:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    name: Delete merged branch
    runs-on: self-hosted
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Delete merged head branch
        shell: cmd
        env:
          MERGED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: git push origin --delete "%MERGED_BRANCH%" || echo Branch was already removed.
