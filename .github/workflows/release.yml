name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dosprotect-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish stable release
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $text = Get-Content .\src\extension.h -Raw
          $versionMatch = [regex]::Match($text, '#define\s+DOSP_VERSION\s+"([^"]+)"')
          if (-not $versionMatch.Success) { throw 'DOSP_VERSION was not found.' }

          $version = $versionMatch.Groups[1].Value
          if ($version -match '-') {
            Write-Host "Development version $version; nothing to release."
            exit 0
          }

          $tag = "v$version"
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          try {
            Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers | Out-Null
            Write-Host "Release $tag already exists; nothing to do."
            exit 0
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }

          git fetch --tags --force
          $tagExists = [bool](git tag -l $tag)

          & .\scripts\verify-mitigation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Mitigation verification failed.' }

          & .\scripts\build.ps1 -Target all -Configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }

          $l4d1 = "dosprotect-$version-l4d1-win32.zip"
          $l4d2 = "dosprotect-$version-l4d2-win32.zip"
          Compress-Archive -Path .\artifacts\dosprotect-l4d-win32\* -DestinationPath $l4d1 -Force
          Compress-Archive -Path .\artifacts\dosprotect-l4d2-win32\* -DestinationPath $l4d2 -Force

          $hash1 = (Get-FileHash $l4d1 -Algorithm SHA256).Hash
          $hash2 = (Get-FileHash $l4d2 -Algorithm SHA256).Hash
          @(
            "$hash1  $l4d1"
            "$hash2  $l4d2"
          ) | Set-Content -Path SHA256SUMS.txt -Encoding ascii

          if (-not $tagExists) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $tag -m "DoS Protect $version"
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not push tag $tag." }
          }

          $changelog = Get-Content .\CHANGELOG.md -Raw
          $escaped = [regex]::Escape($version)
          $changeMatch = [regex]::Match($changelog, "(?ms)^##\s+$escaped\s*\r?\n(.*?)(?=^##\s+|\z)")
          if (-not $changeMatch.Success) { throw "No changelog section found for $version." }

          $deps = Import-PowerShellDataFile .\build\dependencies.psd1
          $notes = "Built and tested with Metamod:Source $($deps.MetamodSource.Ref) (commit $($deps.MetamodSource.Commit)).`r`n`r`n" + $changeMatch.Groups[1].Value.Trim()

          $payload = @{
            tag_name = $tag
            target_commitish = $env:GITHUB_SHA
            name = "DoS Protect $version"
            body = $notes
            draft = $false
            prerelease = $false
          } | ConvertTo-Json

          $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers -ContentType 'application/json' -Body $payload
          $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''

          $assets = @($l4d1, $l4d2, 'SHA256SUMS.txt')
          foreach ($asset in $assets) {
            $name = [uri]::EscapeDataString([IO.Path]::GetFileName($asset))
            $contentType = if ($asset.EndsWith('.zip')) { 'application/zip' } else { 'text/plain' }
            Invoke-RestMethod -Method Post -Uri "$uploadUrl?name=$name" -Headers $headers -InFile $asset -ContentType $contentType | Out-Null
          }

          Write-Host "Published DoS Protect $version ($tag)."
