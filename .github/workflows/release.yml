name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dosprotect-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $text = Get-Content .\src\extension.h -Raw
          $match = [regex]::Match($text, '#define\s+DOSP_VERSION\s+"([^"]+)"')
          if (-not $match.Success) { throw 'DOSP_VERSION was not found.' }

          $version = $match.Groups[1].Value
          $tag = "v$version"
          $stable = $version -notmatch '-'

          git fetch --tags --force
          $tagExists = [bool](git tag -l $tag)

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $releaseExists = $false
          try {
            Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers $headers | Out-Null
            $releaseExists = $true
          } catch {
            if ($_.Exception.Response.StatusCode.value__ -ne 404) { throw }
          }

          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=$tag`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "stable=$($stable.ToString().ToLowerInvariant())`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag_exists=$($tagExists.ToString().ToLowerInvariant())`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "release_exists=$($releaseExists.ToString().ToLowerInvariant())`n", $utf8)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify mitigation
        if: steps.version.outputs.stable == 'true' && steps.version.outputs.release_exists != 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\verify-mitigation.ps1

      - name: Build release packages
        if: steps.version.outputs.stable == 'true' && steps.version.outputs.release_exists != 'true'
        shell: cmd
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\build.ps1 -Target all -Configuration Release

      - name: Package release assets
        if: steps.version.outputs.stable == 'true' && steps.version.outputs.release_exists != 'true'
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $l4d1 = "dosprotect-$version-l4d1-win32.zip"
          $l4d2 = "dosprotect-$version-l4d2-win32.zip"

          Compress-Archive -Path .\artifacts\dosprotect-l4d-win32\* -DestinationPath $l4d1 -Force
          Compress-Archive -Path .\artifacts\dosprotect-l4d2-win32\* -DestinationPath $l4d2 -Force

          $hash1 = (Get-FileHash $l4d1 -Algorithm SHA256).Hash
          $hash2 = (Get-FileHash $l4d2 -Algorithm SHA256).Hash
          @(
            "$hash1  $l4d1"
            "$hash2  $l4d2"
          ) | Set-Content -Path SHA256SUMS.txt -Encoding ascii

      - name: Create tag and GitHub release
        if: steps.version.outputs.stable == 'true' && steps.version.outputs.release_exists != 'true'
        shell: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'

          if ('${{ steps.version.outputs.tag_exists }}' -ne 'true') {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a $tag -m "DoS Protect $version"
            git push origin $tag
          }

          $changelog = Get-Content .\CHANGELOG.md -Raw
          $escaped = [regex]::Escape($version)
          $match = [regex]::Match($changelog, "(?ms)^##\s+$escaped\s*\r?\n(.*?)(?=^##\s+|\z)")
          if (-not $match.Success) { throw "No changelog section found for $version." }

          $deps = Import-PowerShellDataFile .\build\dependencies.psd1
          $notes = "Built and tested with Metamod:Source $($deps.MetamodSource.Ref) (commit $($deps.MetamodSource.Commit)).`r`n`r`n" + $match.Groups[1].Value.Trim()

          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $payload = @{
            tag_name = $tag
            target_commitish = $env:GITHUB_SHA
            name = "DoS Protect $version"
            body = $notes
            draft = $false
            prerelease = $false
          } | ConvertTo-Json

          $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases" -Headers $headers -ContentType 'application/json' -Body $payload
          $uploadUrl = $release.upload_url -replace '\{\?name,label\}$', ''

          $assets = @(
            "dosprotect-$version-l4d1-win32.zip",
            "dosprotect-$version-l4d2-win32.zip",
            'SHA256SUMS.txt'
          )

          foreach ($asset in $assets) {
            $name = [uri]::EscapeDataString([IO.Path]::GetFileName($asset))
            $contentType = if ($asset.EndsWith('.zip')) { 'application/zip' } else { 'text/plain' }
            Invoke-RestMethod -Method Post -Uri "$uploadUrl?name=$name" -Headers $headers -InFile $asset -ContentType $contentType | Out-Null
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
