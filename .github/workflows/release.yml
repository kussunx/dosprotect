name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dosprotect-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish 2.0.0
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\publish-2.0.0.ps1
