name: Repack v2.0.0

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dosprotect-repack-v2
  cancel-in-progress: false

jobs:
  repack:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Rebuild and replace release assets
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\repack-v2.0.0.ps1
